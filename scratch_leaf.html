
<!DOCTYPE html>
<html>
<style>
body { background: #333; color: white; padding: 50px; }
.test-leaf {
  position: absolute;
  width: 116px;
  height: 56px;
  border-top: 2px solid white;
  border-radius: 50%;
  color: white;
}
.test-leaf::before {
  content: "";
  position: absolute;
  top: -2px;
  left: 0;
  width: 100%;
  height: 100%;
  border-bottom: 2px solid white;
  border-radius: 50%;
  opacity: 0.4;
}
</style>
<body>
  <div class="test-leaf"></div>
</body>
</html>
